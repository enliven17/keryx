[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "@gluwa/asc-contracts/=node_modules/@gluwa/asc-contracts/",
]

[rpc_endpoints]
anvil = "http://127.0.0.1:8546"
creditcoin_testnet = "https://rpc.cc3-testnet.creditcoin.network"
